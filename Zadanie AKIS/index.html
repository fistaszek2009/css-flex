<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ćwiczenie Flex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>Tytuł</h1>
    </header>
    <main class="main-container">
        <section class="card">
            <div class="card-header">
                <h2>Pudełko 1</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: flex-start;"></div>
                <div class="rectangle" style="align-self: center;">
                    <p>Prostokąt 1</p>
                </div>
                <div class="square" style="align-self: flex-end;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Pudełko 2</h2>
            </div>
            <div class="card-content">
                <div class="rectangle" style="align-self: flex-end;">
                    <p>Prostokąt 2</p>
                </div>
                <div class="square" style="align-self: center;"></div>
                <div class="square" style="align-self: flex-start;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Pudełko 3</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: center;"></div>
                <div class="rectangle" style="align-self: flex-start;">
                    <p>Prostokąt 3</p>
                </div>
                <div class="square" style="align-self: flex-end;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Pudełko 4</h2>
            </div>
            <div class="card-content">
                <div class="rectangle" style="align-self: flex-start;">
                    <p>Prostokąt 4</p>
                </div>
                <div class="square" style="align-self: flex-end;"></div>
                <div class="square" style="align-self: center;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Pudełko 5</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: flex-end;"></div>
                <div class="rectangle" style="align-self: center;">
                    <p>Prostokąt 5</p>
                </div>
                <div class="square" style="align-self: flex-start;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Pudełko 6</h2>
            </div>
            <div class="card-content">
                <div class="rectangle" style="align-self: center;">
                    <p>Prostokąt 6</p>
                </div>
                <div class="square" style="align-self: flex-start;"></div>
                <div class="square" style="align-self: flex-end;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Pudełko 7</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: flex-start;"></div>
                <div class="rectangle" style="align-self: flex-end;">
                    <p>Prostokąt 7</p>
                </div>
                <div class="square" style="align-self: center;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Pudełko 8</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: flex-end;"></div>
                <div class="rectangle" style="align-self: center;">
                    <p>Prostokąt 8</p>
                </div>
                <div class="square" style="align-self: flex-start;"></div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>Stopka</p>
    </footer>
</body>
</html>
