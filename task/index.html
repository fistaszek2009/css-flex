<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex task</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>Title</h1>
    </header>
    <main class="main-container">
        <section class="card">
            <div class="card-header">
                <h2>Box 1</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: flex-start;"></div>
                <div class="rectangle" style="align-self: center;">
                    <p>Rectangle 1</p>
                </div>
                <div class="square" style="align-self: flex-end;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Box 2</h2>
            </div>
            <div class="card-content">
                <div class="rectangle" style="align-self: flex-end;">
                    <p>Rectangle 2</p>
                </div>
                <div class="square" style="align-self: center;"></div>
                <div class="square" style="align-self: flex-start;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Box 3</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: center;"></div>
                <div class="rectangle" style="align-self: flex-start;">
                    <p>Rectangle 3</p>
                </div>
                <div class="square" style="align-self: flex-end;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Box 4</h2>
            </div>
            <div class="card-content">
                <div class="rectangle" style="align-self: flex-start;">
                    <p>Rectangle 4</p>
                </div>
                <div class="square" style="align-self: flex-end;"></div>
                <div class="square" style="align-self: center;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Box 5</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: flex-end;"></div>
                <div class="rectangle" style="align-self: center;">
                    <p>Rectangle 5</p>
                </div>
                <div class="square" style="align-self: flex-start;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Box 6</h2>
            </div>
            <div class="card-content">
                <div class="rectangle" style="align-self: center;">
                    <p>Rectangle 6</p>
                </div>
                <div class="square" style="align-self: flex-start;"></div>
                <div class="square" style="align-self: flex-end;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Box 7</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: flex-start;"></div>
                <div class="rectangle" style="align-self: flex-end;">
                    <p>Rectangle 7</p>
                </div>
                <div class="square" style="align-self: center;"></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Box 8</h2>
            </div>
            <div class="card-content">
                <div class="square" style="align-self: flex-end;"></div>
                <div class="rectangle" style="align-self: center;">
                    <p>Rectangle 8</p>
                </div>
                <div class="square" style="align-self: flex-start;"></div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>Footer</p>
    </footer>
</body>
</html>
